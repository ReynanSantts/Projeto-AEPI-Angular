<main class="admin-container">

      <h1>Painel Administrativo</h1>
      <p>Gerencie os locais disponíveis no AEPI.</p>
    </div>

    <button class="btn-sair" (click)="sair()" >Sair</button>

  <section class="admin-conteudo">

  </section>
</main>
